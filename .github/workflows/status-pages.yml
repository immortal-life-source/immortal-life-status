name: Independent continuity status

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-status
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check public visitor routes
        continue-on-error: true
        run: >-
          node check-public-availability.mjs
          --origin https://www.immortal.life
          --attempts 2
          --retry-delay-ms 3000
          --timeout-ms 15000
          --output uptime-report.json
      - name: Build status page
        if: always()
        run: node build-status.mjs uptime-report.json .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish independent status
        id: deployment
        uses: actions/deploy-pages@v4
